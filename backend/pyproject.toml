[project]
name = "backend"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    # Web framework — [standard] includes uvicorn, python-multipart, httptools, etc.
    "fastapi[standard]>=0.115.0",

    # Database
    "sqlmodel>=0.0.21",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Auth
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",

    # OAuth
    "authlib>=1.3",
    "httpx>=0.27",

    # Redis
    "redis>=5.0",

    # Settings
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    "python-dotenv>=1.0",

    # Logging
    "structlog>=24.1",

    # Error tracking
    "sentry-sdk[fastapi]>=2.7",

    # Rate limiting
    "slowapi>=0.1.9",

    # Background jobs
    "celery[redis]>=5.4",

    # Object storage
    "minio>=7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
